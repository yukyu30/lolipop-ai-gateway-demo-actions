name: Diagnose AI Gateway

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ANTHROPIC_BASE_URL: https://ai-gateway.lolipop.jp/anthropic

    steps:
      - name: Validate the secret format
        env:
          API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [[ -z "$API_KEY" ]]; then
            echo "::error::AI_GATEWAY_API_KEY is empty"
            exit 1
          fi

          if [[ "$API_KEY" == *$'\n'* || "$API_KEY" == *$'\r'* ]]; then
            echo "::error::AI_GATEWAY_API_KEY contains a newline"
            exit 1
          fi

          if [[ "$API_KEY" =~ ^[[:space:]] || "$API_KEY" =~ [[:space:]]$ ]]; then
            echo "::error::AI_GATEWAY_API_KEY has leading or trailing whitespace"
            exit 1
          fi

          echo "AI_GATEWAY_API_KEY format check passed"

      - name: Send a control request with an invalid key
        if: always()
        run: |
          response_file="${RUNNER_TEMP}/invalid-key-response.json"
          http_code="$(curl --http1.1 --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'x-api-key: deliberately-invalid-key' \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data '{"model":"anthropic/claude-haiku-4-5","max_tokens":32,"messages":[{"role":"user","content":"Reply with exactly OK."}]}' \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Invalid-key control HTTP status: $http_code"
          jq --compact-output \
            '{type, error_type: .error.type, error_message: .error.message}' \
            "$response_file"

          if [[ "$http_code" != "401" ]]; then
            exit 1
          fi

      - name: Call the minimal Anthropic Messages API
        if: always()
        env:
          API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          response_file="${RUNNER_TEMP}/gateway-response.json"
          http_code="$(curl --http1.1 --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data '{"model":"anthropic/claude-haiku-4-5","max_tokens":32,"messages":[{"role":"user","content":"Reply with exactly OK."}]}' \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Minimal API HTTP status: $http_code"

          if jq --exit-status . "$response_file" >/dev/null 2>&1; then
            jq --compact-output \
              '{type, error_type: .error.type, error_message: .error.message, text: ([.content[]? | select(.type == "text") | .text] | join(""))}' \
              "$response_file"
          else
            echo "Minimal API returned a non-JSON response"
          fi

          if [[ "$http_code" != "200" ]]; then
            exit 1
          fi

      - name: Probe a tool_result content block directly
        if: always()
        env:
          API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          response_file="${RUNNER_TEMP}/tool-result-probe.json"
          http_code="$(curl --http1.1 --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data '{"model":"anthropic/claude-haiku-4-5","max_tokens":32,"messages":[{"role":"user","content":[{"type":"tool_result","tool_use_id":"toolu_probe","content":"TOOL_OK"}]}]}' \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Standalone tool_result probe HTTP status: $http_code"
          jq --compact-output \
            '{type, error_type: .error.type, error_message: .error.message}' \
            "$response_file"

      - name: Probe a tool round trip without thinking blocks
        if: always()
        env:
          API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          first_response="${RUNNER_TEMP}/direct-tool-first-response.json"
          first_status="$(curl --http1.1 --silent --show-error \
            --output "$first_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data '{"model":"anthropic/claude-haiku-4-5","max_tokens":128,"tools":[{"name":"echo_value","description":"Return the supplied value.","input_schema":{"type":"object","properties":{"value":{"type":"string"}},"required":["value"]}}],"tool_choice":{"type":"tool","name":"echo_value"},"messages":[{"role":"user","content":"Use echo_value with TOOL_OK."}]}' \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Direct tool first-turn HTTP status: $first_status"
          jq --compact-output \
            '{type, stop_reason, content_types: [.content[]?.type], tool_use: ([.content[]? | select(.type == "tool_use") | {id, name, input}] | first)}' \
            "$first_response"

          if [[ "$first_status" != "200" ]]; then
            exit 0
          fi

          tool_block="$(jq --compact-output \
            '[.content[]? | select(.type == "tool_use") | {type, id, name, input}] | first // empty' \
            "$first_response")"

          if [[ -z "$tool_block" ]]; then
            echo "No tool_use block returned; skipping the second turn"
            exit 0
          fi

          second_request="${RUNNER_TEMP}/direct-tool-second-request.json"
          jq --null-input \
            --argjson tool "$tool_block" \
            '{
              model: "anthropic/claude-haiku-4-5",
              max_tokens: 128,
              tools: [{
                name: "echo_value",
                description: "Return the supplied value.",
                input_schema: {
                  type: "object",
                  properties: {value: {type: "string"}},
                  required: ["value"]
                }
              }],
              messages: [
                {role: "user", content: "Use echo_value with TOOL_OK."},
                {role: "assistant", content: [$tool]},
                {role: "user", content: [{
                  type: "tool_result",
                  tool_use_id: $tool.id,
                  content: "TOOL_OK"
                }]}
              ]
            }' > "$second_request"

          second_response="${RUNNER_TEMP}/direct-tool-second-response.json"
          second_status="$(curl --http1.1 --silent --show-error \
            --output "$second_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data-binary "@${second_request}" \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Direct tool second-turn HTTP status: $second_status"
          jq --compact-output \
            '{type, error_type: .error.type, error_message: .error.message, stop_reason, content_types: [.content[]?.type]}' \
            "$second_response"

      - name: Probe a tool round trip with thinking blocks
        if: always()
        env:
          API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          first_request="${RUNNER_TEMP}/thinking-tool-first-request.json"
          jq --null-input '{
            model: "anthropic/claude-haiku-4-5",
            max_tokens: 2048,
            thinking: {type: "enabled", budget_tokens: 1024},
            tools: [{
              name: "echo_value",
              description: "Return the supplied value. You must use this tool when asked.",
              input_schema: {
                type: "object",
                properties: {value: {type: "string"}},
                required: ["value"]
              }
            }],
            messages: [{
              role: "user",
              content: "You must use echo_value exactly once with TOOL_OK."
            }]
          }' > "$first_request"

          first_response="${RUNNER_TEMP}/thinking-tool-first-response.json"
          first_status="$(curl --http1.1 --silent --show-error \
            --output "$first_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data-binary "@${first_request}" \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Thinking tool first-turn HTTP status: $first_status"
          jq --compact-output \
            '{type, error_type: .error.type, error_message: .error.message, stop_reason, content_types: [.content[]?.type], tool_use: ([.content[]? | select(.type == "tool_use") | {id, name, input}] | first)}' \
            "$first_response"

          if [[ "$first_status" != "200" ]]; then
            exit 0
          fi

          tool_use_id="$(jq --raw-output \
            '[.content[]? | select(.type == "tool_use") | .id] | first // empty' \
            "$first_response")"

          if [[ -z "$tool_use_id" ]]; then
            echo "No tool_use block returned; skipping the thinking second turn"
            exit 0
          fi

          second_request="${RUNNER_TEMP}/thinking-tool-second-request.json"
          jq --null-input \
            --argjson assistant_content "$(jq --compact-output '.content' "$first_response")" \
            --arg tool_use_id "$tool_use_id" \
            '{
              model: "anthropic/claude-haiku-4-5",
              max_tokens: 2048,
              thinking: {type: "enabled", budget_tokens: 1024},
              tools: [{
                name: "echo_value",
                description: "Return the supplied value. You must use this tool when asked.",
                input_schema: {
                  type: "object",
                  properties: {value: {type: "string"}},
                  required: ["value"]
                }
              }],
              messages: [
                {
                  role: "user",
                  content: "You must use echo_value exactly once with TOOL_OK."
                },
                {role: "assistant", content: $assistant_content},
                {role: "user", content: [{
                  type: "tool_result",
                  tool_use_id: $tool_use_id,
                  content: "TOOL_OK"
                }]}
              ]
            }' > "$second_request"

          second_response="${RUNNER_TEMP}/thinking-tool-second-response.json"
          second_status="$(curl --http1.1 --silent --show-error \
            --output "$second_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data-binary "@${second_request}" \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "Thinking tool second-turn HTTP status: $second_status"
          jq --compact-output \
            '{type, error_type: .error.type, error_message: .error.message, stop_reason, content_types: [.content[]?.type]}' \
            "$second_response"

      - name: Call Lolipop AI Gateway with Claude Code
        if: always()
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          show_full_output: true
          prompt: 'Reply with exactly OK.'
          claude_args: '--model anthropic/claude-haiku-4-5 --max-turns 1'

      - name: Verify a Claude Code tool round trip
        if: always()
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          show_full_output: true
          prompt: |
            Use the Bash tool exactly once to run: printf TOOL_OK
            After reading the tool result, reply with exactly TOOL_DONE.
          claude_args: >-
            --model anthropic/claude-haiku-4-5
            --max-turns 3
            --allowedTools "Bash(printf TOOL_OK)"
