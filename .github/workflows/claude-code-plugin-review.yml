name: Claude Code Plugin Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

jobs:
  code-review:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: https://ai-gateway.lolipop.jp/anthropic
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Probe API key rules
        env:
          API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          response_file="${RUNNER_TEMP}/api-rule-probe.json"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${API_KEY}" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'content-type: application/json' \
            --data '{"model":"anthropic/claude-haiku-4-5","max_tokens":16,"messages":[{"role":"user","content":"Reply OK."}]}' \
            "${ANTHROPIC_BASE_URL}/v1/messages")"

          echo "API probe HTTP status: $http_status"
          if [[ "$http_status" != "200" ]]; then
            jq --raw-output '"API probe error type: " + (.error.type // "unknown")' "$response_file"
            exit 1
          fi

      - name: Run code-review plugin
        id: plugin-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          settings: |
            {
              "env": {
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "2048"
              }
            }
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr_number }}
          claude_args: --model anthropic/claude-haiku-4-5 --max-turns 50

      - name: Classify API failure
        if: failure()
        env:
          EXECUTION_FILE: ${{ steps.plugin-review.outputs.execution_file }}
        run: |
          if [[ -z "$EXECUTION_FILE" || ! -f "$EXECUTION_FILE" ]]; then
            echo "Failure category: execution file unavailable"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("Insufficient balance")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: insufficient balance"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("Unsupported Anthropic content block")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: unsupported Anthropic content block"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("max turns")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: max turns"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | length == 0' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: empty result"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | test("(^|[^0-9])400([^0-9]|$)")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: HTTP 400"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | test("(^|[^0-9])401([^0-9]|$)")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: HTTP 401"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | test("(^|[^0-9])402([^0-9]|$)")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: HTTP 402"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | test("(^|[^0-9])403([^0-9]|$)")' "$EXECUTION_FILE" > /dev/null; then
            if jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("account_inactive")' "$EXECUTION_FILE" > /dev/null; then
              echo "Failure category: account_inactive"
            elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("project_inactive")' "$EXECUTION_FILE" > /dev/null; then
              echo "Failure category: project_inactive"
            elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("budget_guardrail_exceeded")' "$EXECUTION_FILE" > /dev/null; then
              echo "Failure category: budget_guardrail_exceeded"
            elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("model_not_allowed")' "$EXECUTION_FILE" > /dev/null; then
              echo "Failure category: model_not_allowed"
            elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("auto_required")' "$EXECUTION_FILE" > /dev/null; then
              echo "Failure category: auto_required"
            elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | contains("permission_denied")' "$EXECUTION_FILE" > /dev/null; then
              echo "Failure category: permission_denied"
            else
              echo "Failure category: HTTP 403"
            fi
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | test("(^|[^0-9])429([^0-9]|$)")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: HTTP 429"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | test("(^|[^0-9])5[0-9]{2}([^0-9]|$)")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: HTTP 5xx"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | ascii_downcase | contains("rate limit")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: rate limit"
          elif jq --exit-status '[.[] | select(.type == "result") | .result] | last | ascii_downcase | contains("model")' "$EXECUTION_FILE" > /dev/null; then
            echo "Failure category: model"
          else
            echo "Failure category: unclassified"
          fi
