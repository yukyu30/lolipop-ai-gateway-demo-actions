name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # This demo sends the PR diff to the configured external AI Gateway.
    # Only review trusted branches created by the repository owner.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'yukyu30'

    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: https://ai-gateway.lolipop.jp/anthropic
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          # The gateway supports tool_use/tool_result, but currently rejects a
          # thinking block when Claude Code replays it on the next tool turn.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_THINKING": "1",
                "MAX_THINKING_TOKENS": "0",
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "4096",
                "CLAUDE_CODE_MAX_TOOL_USE_CONCURRENCY": "2"
              }
            }
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: "--model anthropic/claude-sonnet-4-6"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Print sanitized Claude error result
        if: failure()
        shell: bash
        run: |
          output_file="${RUNNER_TEMP}/claude-execution-output.json"

          if [[ ! -f "$output_file" ]]; then
            echo "Claude execution output file was not found"
            exit 0
          fi

          jq --compact-output '
            if type == "array" then .[] else . end
            | select(type == "object" and .type == "result" and .is_error == true)
            | {
                subtype,
                is_error,
                num_turns,
                result: ((.result // "") | tostring | .[0:2000])
              }
          ' "$output_file" \
            | sed -E \
                -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[REDACTED_EMAIL]/g' \
                -e 's/(sk-|key-)[[:alnum:]_-]{12,}/[REDACTED_KEY]/g'
