name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # This demo sends the PR diff to the configured external AI Gateway.
    # Only review trusted branches created by the repository owner.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'yukyu30'

    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: https://ai-gateway.lolipop.jp/anthropic
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Keep thinking enabled so this workflow also verifies that the
          # gateway accepts replayed thinking blocks across tool turns.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "2048"
              }
            }
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use the allowed `gh pr view` and `gh pr diff` Bash tools to inspect
            this pull request before reviewing it.

            Perform a concise but comprehensive code review covering:

            1. Code quality and definite bugs
            2. Security vulnerabilities
            3. Performance problems
            4. Missing or inadequate tests
            5. Documentation accuracy

            Report only high-confidence, actionable findings. Provide inline
            comments for specific issues and a top-level summary. If there are
            no findings, post a short top-level approval summary.
          claude_args: >-
            --model anthropic/claude-haiku-4-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Print sanitized Claude execution evidence
        if: always()
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          output_file="$EXECUTION_FILE"

          if [[ -z "$output_file" || ! -f "$output_file" ]]; then
            echo "Claude execution output file was not found"
            exit 0
          fi

          jq --compact-output '
            ([
              .[]
              | select(.type == "assistant")
              | .message.content[]?
              | .type
            ] | unique) as $assistant_content_types
            | ([
              .[]
              | select(.type == "assistant")
              | .message.content[]?
              | select(.type == "thinking")
            ] | length) as $thinking_block_count
            | ([
              .[]
              | select(.type == "user")
              | .message.content[]?
              | select(.type == "tool_result")
            ] | length) as $tool_result_count
            | [
              .[]
              | select(.type == "assistant")
              | .message.content[]?
              | select(.type == "tool_use")
              | {
                  name,
                  command: ((.input.command // "") | tostring | .[0:500])
                }
            ] as $tool_uses
            | ([
                .[]
                | select(.type == "result")
                | {
                    subtype,
                    is_error,
                    num_turns,
                    total_cost_usd,
                    permission_denials_count,
                    result: ((.result // "") | tostring | .[0:500])
                  }
              ] | last) as $result
            | {
                assistant_content_types: $assistant_content_types,
                thinking_block_count: $thinking_block_count,
                tool_result_count: $tool_result_count,
                tool_uses: $tool_uses,
                result: $result
              }
          ' "$output_file" \
            | sed -E \
                -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[REDACTED_EMAIL]/g' \
                -e 's/(sk-|key-)[[:alnum:]_-]{12,}/[REDACTED_KEY]/g'
